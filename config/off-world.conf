# Off-World dynamic wallpaper.

# What drives the wallpaper:
#   cycle    the clock picks the phase - dawn, day, dusk or night - and the
#            phase rotates through its three scenes every couple of hours.
#            RAIN below decides the wet or dry plate. No network requests.
#   weather  the real conditions where you are pick the scene as well as the
#            plate: heavy rain gets Spinner Descent, drizzle gets Neon Signage,
#            clear gets Off-World Colonies. The clock only breaks ties, so a
#            clear night still gets a night scene. Needs network.
#   manual   nothing moves unless you move it, with the key binding or the
#            background switcher.
MODE=cycle

# How rain is decided in cycle mode:
#   random  a weighted coin, held steady for RAIN_SPELL_HOURS at a time so the
#           weather has a mood instead of flickering. Makes no network requests.
#   live    real precipitation where you are, via Open-Meteo (needs network)
#   always  always the rain variants
#   never   always the clear variants
RAIN=random

# Chance of rain per spell, 0.0 to 1.0. Only used when RAIN=random.
RAIN_CHANCE=0.5

# How long one spell of weather lasts, in hours.
RAIN_SPELL_HOURS=3

# Coordinates, used for sunrise and sunset (and for the weather lookup in
# weather mode or RAIN=live). Left blank they are derived from your system
# timezone via /usr/share/zoneinfo, which never leaves this machine.
LAT=
LON=
